map "$uri:$sent_http_content_type" $querycraft_cache_control {
  default "";
  ~:text/html "no-store";
  "~^/assets/.*-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+:" "public, max-age=31536000, immutable";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control "$querycraft_cache_control" always;

  location = /docs { return 404; }
  location = /redoc { return 404; }
  location = /docs/oauth2-redirect { return 404; }
  location = /openapi.json { return 404; }

  location /api/v1/ {
    proxy_pass http://backend:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
